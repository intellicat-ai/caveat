name: CAVEAT Ontology Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      # cffconvert 2.0.0 pins jsonschema<4, which the reporting checker
      # cannot use, so it runs in its own environment.
      - name: Validate CITATION.cff
        run: pipx run --spec cffconvert==2.0.0 cffconvert --validate

      - name: Validate ontology
        run: python scripts/validate.py

      - name: Check caveat CURIEs
        run: python scripts/check_curies.py . --allow .caveat-curie-allowlist

      - name: OpenAlex mapping is current
        run: python scripts/build_openalex_mapping.py --check

      - name: Profile examples are valid
        run: python scripts/check_assessment.py vocabularies/profiles/examples/*.json --taxonomy mappings/openalex/openalex.ttl

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Verify vocabulary inheritance resolves
        run: |
          python scripts/resolve_vocabulary.py caveat:BiofieldEnergyHealing \
            > /tmp/vocab.json
          python - <<'EOF'
          import json, sys
          d = json.load(open('/tmp/vocab.json'))
          expected = [
              "engagement/biofield-energy-healing.yaml",
              "engagement/vitalist-energy-medicine.yaml",
              "rejection/pseudoscience-base.yaml",
          ]
          if d["lexicon_files"] != expected:
              sys.exit(f"Inheritance chain broken: {d['lexicon_files']}")
          print("chain OK:", d["term_count"], "terms")
          EOF
