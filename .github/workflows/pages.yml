name: Publish CAVEAT to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Build Jekyll site from docs/
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      # The Jekyll action runs as root in a container. Without this the
      # overlay steps below fail on permissions.
      - name: Fix artifact ownership
        run: sudo chown -R "$(id -u):$(id -g)" _site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install rdflib

      - name: Overlay ontology artifacts
        run: |
          set -euo pipefail
          mkdir -p _site/examples _site/vocabularies
          python scripts/build_artifacts.py _site
          cp -r examples/.     _site/examples/
          cp -r vocabularies/. _site/vocabularies/
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
