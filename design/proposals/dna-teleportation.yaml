summary: 'Evaluates the claim that DNA sequences in highly diluted water emit electromagnetic signals
  that can be recorded, transmitted and used to rebuild the DNA, as a candidate child of water memory.
  It falls short of the publication footprint for a mode of its own, so it is handled as vocabulary of
  water memory: a new water-memory lexicon with the one term that reached the precision threshold.'
sources: []
classes:
- name: WaterMemory
  op: update
  lexicon_file: engagement/water-memory.yaml
  checks:
    candidate: A child of water memory for the claim that diluted DNA emits electromagnetic signals from
      which the DNA can be rebuilt elsewhere.
    genus_holds: Yes. The claim is that water retains and passes on information about a substance no longer
      present, which is the water-memory differentia.
    r2_test: Advances constructs of its own (signal-emitting aqueous nanostructures) and is excluded by
      first principles through its parent chain; it is neither defined by opposition to a consensus nor
      a measurement at the detection limit.
    footprint: Fails R5. An OpenAlex query on the claim's distinctive phrases found 11 works, mostly from
      one research group and its commentators, against a default of 25 works from 3 independent author
      groups.
    footprint_query: title_and_abstract.search:("DNA teleportation" OR "aqueous nanostructures" OR "electromagnetic
      signals from DNA" OR "DNA waves" OR "electromagnetic signals produced by"), title_and_abstract.search:(DNA
      AND water), 2026-11-09
    decision: No new class (R5, R10). The claim stays a clause of water memory, and its distinctive vocabulary
      goes into a water-memory lexicon.
    rebuttal: Gap. No replication, reanalysis or forensic critique was found in OpenAlex; news coverage
      exists but its text was not available.
